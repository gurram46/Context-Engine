[package]
name = "contextd"
version = "0.1.0"
edition = "2021"
description = "Rust MCP compatibility shell over V2 backend — R0"
license = "MIT"

[[bin]]
name = "contextd"
path = "src/main.rs"

[dependencies]
context-core = { path = "../context-core" }
context-index = { path = "../context-index" }
context-rank = { path = "../context-rank" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
tempfile = "3"
