[workspace]
members = ["crates/contextd", "crates/context-core"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.1.2", features = ["server", "client", "transport-io", "transport-child-process", "macros"] }
schemars = "1"
